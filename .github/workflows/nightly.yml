name: Firmware check

# Every hour: check every tracked source and publish any change. Once a day (the first
# run after 08:00 UTC): render the browser-only vendor pages, discover and vet new projects,
# then send the digest and the per-user emails for everything that moved since yesterday.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "Run the once-a-day steps too (browser render, discovery, digest, emails)"
        type: boolean
        default: true
      force_digest:
        description: "Build a digest of every tracked device even if nothing changed (for testing)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# never let two checks race each other into the same commit
concurrency:
  group: firmware-check
  cancel-in-progress: false

jobs:
  check:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 from Oct 19, 2026, and the
    # daily run installs headless Chromium with its system packages, the step most likely
    # to break on a new OS. Move every workflow to 26 together, after a test run on it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is this the once-a-day run?
        id: when
        env:
          FORCE_DAILY: ${{ github.event_name == 'workflow_dispatch' && inputs.daily }}
        run: python3 scripts/schedule.py >> "$GITHUB_OUTPUT"

      - name: Install Playwright (headless Chromium)
        if: steps.when.outputs.daily == 'true'
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Render JS-only vendor pages
        if: steps.when.outputs.daily == 'true'
        run: python3 scripts/fetch_browser.py

      - name: Check every tracked source
        env:
          GITHUB_TOKEN: ${{ github.token }}   # 1,000 API calls/hour/repo; unchanged repos answer 304, which is free
        run: |
          if [ "${{ inputs.force_digest }}" = "true" ]; then
            python3 scripts/fetch.py --force-digest
          else
            python3 scripts/fetch.py
          fi

      # Shadow test: TypeSafe's Jev judges each new release (security fix? end of life?) next
      # to the regexes and logs both to typesafe_shadow.json. Changes nothing on the site.
      # Skipped without the secret; can never fail the run.
      - name: TypeSafe shadow judgments
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 scripts/typesafe_shadow.py

      - name: Discover and vet new projects
        if: steps.when.outputs.daily == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/discover.py

      - name: Build device pages
        run: python3 scripts/build_pages.py

      # Drains pending_changes.json into digest.md + changed.json, creates the Beehiiv draft,
      # marks today as done. Only on the daily run so Pro members get one email a day. Also
      # adds the day to weekly_changes.json, which becomes changed_weekly.json each Monday.
      - name: Build the daily digest
        if: steps.when.outputs.daily == 'true'
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
        run: python3 scripts/digest.py

      # Commit when data changed. A run where only the "checked" timestamps moved is not
      # worth a deploy, unless the last commit is over six hours old (keeps "last checked"
      # honest on the site without 48 deploys a day).
      - name: Commit data and pages if they changed
        run: |
          git config user.name "firmwarely-bot"
          git config user.email "bot@firmwarely.com"
          # vercel.json carries the redirects for devices we don't publish, and build_pages
          # rewrites it from the catalogue — leaving it out would let a rule for a device
          # that has come back shadow its page, because Vercel redirects before it serves files.
          PUBLISHED="devices.json sources.json pending_changes.json weekly_changes.json digest_state.json typesafe_shadow.json redirects.json vercel.json
                     devices category brands 404.html sitemap.xml sitemaps robots.txt pro legal support"
          git add $PUBLISHED
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          AGE=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if git diff --cached --quiet -I '"generated": ' -I '"checked": ' -I '"last_daily' && [ "$AGE" -lt 21600 ]; then
            echo "Only timestamps moved and the last commit is ${AGE}s old; not committing."
            git reset -q
            exit 0
          fi
          git commit -m "check: update devices.json ($(date -u +%Y-%m-%dT%H:%MZ))"
          # rebase onto the branch this run is on (main on schedule; a PR branch when dispatched
          # for validation) — pulling main into a shallow PR checkout conflicts on every file
          for attempt in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME"
            if git rebase -q FETCH_HEAD; then
              git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
              continue
            fi
            # A change merged while this run was checking and both touched generated pages.
            # Never hand-merge those: keep this run's data, take the branch as it now is,
            # re-apply the hand edits and rebuild every page with the merged code.
            git rebase --abort
            echo "Branch moved during the run (attempt $attempt); rebuilding on top of it."
            SAVED="$RUNNER_TEMP/run-data"; rm -rf "$SAVED"; mkdir -p "$SAVED"
            cp pending_changes.json weekly_changes.json digest_state.json typesafe_shadow.json sources.json devices.json "$SAVED"/ 2>/dev/null || true
            git reset -q --hard FETCH_HEAD
            python3 scripts/rebase_data.py "$SAVED"
            python3 scripts/catalog_edits.py
            python3 scripts/build_pages.py
            git add $PUBLISHED
            git diff --cached --quiet && exit 0
            git commit -q -m "check: update devices.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
          done
          echo "::error::could not push after 3 attempts"; exit 1

      - name: Open an issue with the digest (emails you)
        if: ${{ hashFiles('digest.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create digest --color 0E8A16 --description "Daily firmware digest" --force || true
          gh issue create \
            --title "$(head -n 1 digest.md | sed 's/^# //')" \
            --body-file digest.md \
            --label digest || gh issue create --title "$(head -n 1 digest.md | sed 's/^# //')" --body-file digest.md

      # Mail each subscriber about the devices they saved on /my-devices.html, and only when
      # one of them moved: Pro daily (changed.json), free weekly (changed_weekly.json, written
      # on the weekly run). Skipped automatically when RESEND_API_KEY / the Beehiiv secrets
      # aren't set. On a force_digest run it refuses to mail real people unless
      # USER_ALERT_TEST_EMAIL is set, in which case every alert goes there instead.
      - name: Send per-user device alerts
        if: ${{ hashFiles('changed.json') != '' || hashFiles('changed_weekly.json') != '' }}
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          USER_ALERT_PLANS: ${{ vars.USER_ALERT_PLANS }}
          USER_ALERT_TEST_EMAIL: ${{ secrets.USER_ALERT_TEST_EMAIL }}
        run: python3 scripts/user_alerts.py
