name: Nightly firmware check

on:
  schedule:
    - cron: "15 8 * * *"   # 08:15 UTC = 3:15 AM Central (daylight time)
  workflow_dispatch:
    inputs:
      force_digest:
        description: "Build a digest of every tracked device even if nothing changed (for testing)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (headless Chromium)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Render JS-only pages
        run: python3 scripts/fetch_browser.py

      - name: Fetch latest firmware versions
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
          GITHUB_TOKEN: ${{ github.token }}   # 60 API calls/hour unauthenticated, 1,000 with this
        run: |
          if [ "${{ inputs.force_digest }}" = "true" ]; then
            python3 scripts/fetch.py --force-digest
          else
            python3 scripts/fetch.py
          fi

      - name: Build device pages
        run: python3 scripts/build_pages.py

      - name: Commit devices.json and pages if they changed
        run: |
          git config user.name "firmwarely-bot"
          git config user.email "bot@firmwarely.com"
          git add devices.json devices sitemap.xml robots.txt pro legal
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "nightly: update devices.json ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi

      - name: Open an issue with the digest (emails you)
        if: ${{ hashFiles('digest.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(head -n 1 digest.md | sed 's/^# //')" \
            --body-file digest.md \
            --label digest || gh issue create --title "$(head -n 1 digest.md | sed 's/^# //')" --body-file digest.md

      - name: Send Pro instant alert via Beehiiv
        if: ${{ hashFiles('digest.md') != '' }}
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
          BEEHIIV_PRO_SEG_ID: ${{ secrets.BEEHIIV_PRO_SEG_ID }}
          PRO_ALERT_TEST: ${{ inputs.force_digest == true && '1' || '0' }}
        run: python3 scripts/pro_alert.py

      # Personal email per subscriber: only the devices they saved on /my-devices.html.
      # Skipped automatically when RESEND_API_KEY / the Beehiiv secrets aren't set yet.
      # On a force_digest run it refuses to mail real people unless USER_ALERT_TEST_EMAIL
      # is set, in which case every alert goes there instead.
      - name: Send per-user device alerts
        if: ${{ hashFiles('changed.json') != '' }}
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          USER_ALERT_PLANS: ${{ vars.USER_ALERT_PLANS }}
          USER_ALERT_TEST_EMAIL: ${{ secrets.USER_ALERT_TEST_EMAIL }}
        run: python3 scripts/user_alerts.py
