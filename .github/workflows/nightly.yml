name: Nightly firmware check

on:
  schedule:
    - cron: "15 8 * * *"   # 08:15 UTC = 3:15 AM Central (daylight time)
  workflow_dispatch:        # lets you press "Run workflow" on the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest firmware versions
        run: python3 scripts/fetch.py

      - name: Commit devices.json if it changed
        run: |
          git config user.name "firmwarely-bot"
          git config user.email "bot@firmwarely.com"
          git add devices.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "nightly: update devices.json ($(date -u +%Y-%m-%d))"
            git push
          fi
