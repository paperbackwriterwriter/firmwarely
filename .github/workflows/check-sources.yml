name: Checks

# Two jobs, both read-only. selftest covers the logic that decides who gets emailed;
# sources fetches every tracked source so a wrong repo or a dead release page is caught
# on the pull request instead of going quiet in the nightly run.

on:
  pull_request:
    paths:
      - "sources.json"
      - "scripts/**"
      - "lib/**"
      - "api/**"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated device ids to check (blank = all)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alert pipeline self-test
        run: python3 scripts/selftest.py

  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every source resolves
        env:
          GITHUB_TOKEN: ${{ github.token }}   # 60 API calls/hour without this, 1,000 with it
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python3 scripts/check_sources.py --only "${{ inputs.only }}"
          else
            python3 scripts/check_sources.py
          fi
